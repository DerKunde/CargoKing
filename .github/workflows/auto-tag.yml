name: Create Version Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  tag:
    name: Create Version Tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest tag: $LATEST"

          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$(git rev-parse --short HEAD) is already tagged as $(git tag --points-at HEAD | head -1)."
            exit 1
          fi

          MAJOR=$(echo "$LATEST" | sed 's/v\([0-9]*\)\..*/\1/')
          MINOR=$(echo "$LATEST" | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
          PATCH=$(echo "$LATEST" | sed 's/v[0-9]*\.[0-9]*\.\([0-9]*\)/\1/')

          if [ "$BUMP" = "major" ]; then
            NEW_VERSION="v$((MAJOR + 1)).0.0"
          elif [ "$BUMP" = "minor" ]; then
            NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "value=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bump: ${BUMP} — ${LATEST} → ${NEW_VERSION}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.value }} -m "Release ${{ steps.version.outputs.value }}"
          git push origin ${{ steps.version.outputs.value }}

name: Unity CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-ci.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-ci.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
      run_build:
        description: 'Run build'
        required: false
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ensure-up-to-date:
    name: Branch up to date with main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'Skip-CI')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false

      - name: Check commits behind main
        run: |
          git fetch origin main
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND" -gt 0 ]; then
            echo "❌ Branch is $BEHIND commit(s) behind main. Please rebase or merge main into your branch first."
            exit 1
          fi
          echo "✅ Branch is up to date with main"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [ensure-up-to-date]
    if: |
      always() &&
      (needs.ensure-up-to-date.result == 'success' || needs.ensure-up-to-date.result == 'skipped') &&
      !contains(github.event.pull_request.labels.*.name, 'Skip-CI') &&
      (!github.event.inputs.run_tests || github.event.inputs.run_tests == 'true')
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-editmode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-editmode-
            Library-

      - name: Run tests
        id: unity_tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          testMode: all
          artifactsPath: test-results
          checkName: Test Results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customImage: unityci/editor:ubuntu-6000.3.8f1-windows-mono-3.2.1

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Test-Results
          path: test-results
          retention-days: 14

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'failure')
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # A missing artifact is not fatal here: the script then reports "no results" and fails.
      - name: Download test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Test-Results
          path: test-results

      - name: Summarize test results
        shell: pwsh
        run: ./.github/scripts/Summarize-TestResults.ps1 -ResultsDir test-results -BadgesDir badges

      - name: Upload badges
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Badges
          path: badges
          retention-days: 1

  # The only job with write access. It keeps the badge JSONs as a single commit on the
  # orphan branch "badges", which the README badges read through shields.io.
  publish-badges:
    name: Publish Badges
    runs-on: ubuntu-latest
    needs: report
    if: |
      always() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.report.result == 'success' || needs.report.result == 'failure')
    permissions:
      contents: write
    steps:
      - name: Download badges
        uses: actions/download-artifact@v8
        with:
          name: Badges
          path: badges

      - name: Push badges branch
        working-directory: badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b badges
          git add *.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Test badges for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges

  build:
    name: Build for Windows
    runs-on: ubuntu-latest
    needs: test
    if: |
      success() &&
      !contains(github.event.pull_request.labels.*.name, 'Skip-CI') &&
      (!github.event.inputs.run_build || github.event.inputs.run_build == 'true')
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-build-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-build-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: CargoKing
          buildsPath: build

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: Build-Windows
          path: build/StandaloneWindows64
          retention-days: 14
